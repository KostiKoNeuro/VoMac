name: Build MacOS

on:
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Скачиваем твой код
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Устанавливаем Rust (Основа Tauri)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Устанавливаем зависимости (npm install)
        run: npm install

      - name: Собираем macOS приложение (Universal — Intel + Apple Silicon)
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Выдаем готовый установщик для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Installer-Universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
