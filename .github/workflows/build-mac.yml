name: Build macOS

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - universal

env:
  CARGO_TERM_PROGRESS_WIDTH: 80

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - if: inputs.target == 'arm64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - if: inputs.target == 'universal'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      # ── ARM64 ──
      - if: inputs.target == 'arm64'
        name: Build Apple Silicon
        run: npm run tauri build

      # ── Universal: step 1 = ARM64 ──
      - if: inputs.target == 'universal'
        name: Build ARM64
        run: npm run tauri build -- --target aarch64-apple-darwin

      # ── Universal: step 2 = x86_64 ──
      - if: inputs.target == 'universal'
        name: Build Intel
        run: npm run tauri build -- --target x86_64-apple-darwin

      # ── Universal: step 3 = merge with lipo ──
      - if: inputs.target == 'universal'
        name: Merge Universal binary
        run: |
          ARM64_BIN="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Dicta.app/Contents/MacOS/Dicta"
          INTEL_BIN="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Dicta.app/Contents/MacOS/Dicta"
          UNIV_BIN="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Dicta.app/Contents/MacOS/Dicta"

          echo "Checking ARM64: $ARM64_BIN"
          ls -lh "$ARM64_BIN"
          echo "Checking Intel: $INTEL_BIN"
          ls -lh "$INTEL_BIN"

          echo "Merging with lipo..."
          lipo -create "$ARM64_BIN" "$INTEL_BIN" -output "$UNIV_BIN"

          echo "Result:"
          lipo -info "$UNIV_BIN"

      # ── Universal: step 4 = create DMG ──
      - if: inputs.target == 'universal'
        name: Create DMG
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Dicta.app"
          brew install create-dmg
          create-dmg \
            --app-drop-link 480 280 \
            --window-pos 200 120 \
            --window-size 600 400 \
            --volname "Dicta" \
            --volicon "src-tauri/icons/icon.icns" \
            --icon "Dicta.app" 140 195 \
            "src-tauri/target/Dicta-universal.dmg" \
            "$APP"

      # ── Upload ARM64 DMG ──
      - if: inputs.target == 'arm64'
        name: Upload ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Installer-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14

      # ── Upload Universal DMG ──
      - if: inputs.target == 'universal'
        name: Upload Universal installer
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Installer-Universal
          path: src-tauri/target/Dicta-universal.dmg
          retention-days: 14
