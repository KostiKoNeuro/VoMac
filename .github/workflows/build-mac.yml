name: Build MacOS

on:
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  build-macos:
    runs-on: macos-latest # Запрашиваем сервер с macOS от GitHub

    steps:
      - name: Скачиваем твой код
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Устанавливаем Rust (Основа Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Устанавливаем зависимости (npm install)
        run: npm install

      - name: Собираем macOS приложение (.dmg)
        run: npm run tauri build

      - name: Выдаем готовый установщик для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Installer
          path: src-tauri/target/release/bundle/dmg/*.dmg
